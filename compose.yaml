services:
  bot:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: server/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /app/server/data
    volumes:
      - ./server/data:/app/server/data
    expose:
      - "8787"
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in root .env}
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
volumes:
  caddy_data:
  caddy_config:
